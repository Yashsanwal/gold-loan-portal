# docker compose up --build  →  http://localhost:4000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: goldloan
      POSTGRES_PASSWORD: goldloan
      POSTGRES_DB: goldloan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldloan -d goldloan"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgres://goldloan:goldloan@db:5432/goldloan
      AUTO_MIGRATE: "true"
      TRUST_PROXY: "false"
      # Passed through from your shell or .env; leave unset to run without the chat agent.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6.1-terra}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
    ports:
      - "4000:4000"

volumes:
  pgdata:
